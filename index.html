<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator | Abid Developer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="main-wrapper d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="qr-card shadow-lg p-5 rounded-5 text-center">

                    <h1 class="main-title mb-3">
                        URL to QR Code Generator
                    </h1>

                    <p class="subtitle mb-4">
                        Generate stylish QR codes instantly for websites, portfolios, businesses & social media.
                    </p>

                    <div class="input-group mb-4">
                        <input
                            type="text"
                            id="urlInput"
                            class="form-control custom-input"
                            placeholder="Enter your URL here..."
                        >
                    </div>

                    <div class="d-flex gap-3 justify-content-center flex-wrap mb-4">
                        <button id="generateBtn" class="btn generate-btn px-4 py-2">
                            Generate QR
                        </button>

                        <button id="downloadBtn" class="btn download-btn px-4 py-2">
                            Download QR
                        </button>
                    </div>

                    <div id="qrContainer" class="qr-box mt-4"></div>

                </div>

            </div>

        </div>
    </div>

</section>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- QR Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
